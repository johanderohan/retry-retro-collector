server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8m;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'" always;

  # Proxy al backend
  location /api/    { proxy_pass http://backend:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /ss-api/ { proxy_pass http://backend:3001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /covers/ { proxy_pass http://backend:3001; }
  location /logos/  { proxy_pass http://backend:3001; }

  # Service worker: nunca cachear
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.json {
    types { application/manifest+json json; }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Assets con hash: inmutables
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. index.html no se cachea: lleva dentro el hash de los bundles,
  # y si el navegador se queda con una copia vieja sigue cargando el JS antiguo
  # aunque se haya desplegado uno nuevo.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
